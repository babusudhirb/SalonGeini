<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book an appointment | Salon Genie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root{--ink:#30473d;--sage:#58705d;--soft:#eef1e8;--cream:#f8f6ef;--line:#dce3d7;--muted:#6f786e;--white:#fffefa;--good:#4a8064}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px 'DM Sans',sans-serif}.booking-window{max-width:1000px;min-height:100vh;margin:auto;background:var(--white);box-shadow:0 0 42px rgba(48,71,61,.08)}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 34px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font:700 18px 'Libre Baskerville',serif}.brand-mark{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--ink);color:#fff}.branch{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--white);color:var(--sage);font:600 11px 'DM Sans'}.main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;padding:38px 34px}.eyebrow{margin:0 0 9px;color:#71806e;font-size:10px;font-weight:700;letter-spacing:1px}h1{margin:0;font:700 28px 'Libre Baskerville',serif;letter-spacing:-.8px}.intro{margin:9px 0 22px;color:var(--muted);font-size:12px;line-height:1.5}.steps{display:flex;gap:9px;margin-bottom:22px}.step{display:flex;align-items:center;gap:5px;color:#89958a;font-size:10px;font-weight:700}.step i{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#e4eae1;font-style:normal}.step.active{color:var(--ink)}.step.active i{background:var(--ink);color:#fff}.categories{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.categories button{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--white);color:var(--sage);font:600 10px 'DM Sans';cursor:pointer}.categories button.active{border-color:var(--sage);background:var(--soft);color:var(--ink)}.service-list{display:grid;gap:8px}.service{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--white);color:var(--ink);text-align:left;cursor:pointer}.service.active{border-color:var(--sage);background:#f1f5ed;box-shadow:0 0 0 1px rgba(88,112,93,.1)}.check{display:grid;place-items:center;flex:none;width:18px;height:18px;border:1px solid #aebaaa;border-radius:5px;color:transparent;font-size:11px}.service.active .check{border-color:var(--sage);background:var(--sage);color:#fff}.icon{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:8px;background:#e5ecdf;font-size:15px}.copy{flex:1}.copy strong,.copy small{display:block}.copy strong{font-size:11px}.copy small{margin-top:3px;color:var(--muted);font-size:9px}.price{font-size:11px;font-weight:700}.summary{align-self:start;padding:18px;border:1px solid #d8e3d2;border-radius:12px;background:#f1f5ed}.summary h2{margin:0 0 15px;font-size:13px}.summary-schedule{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid #cfdacb}.summary-schedule label{color:var(--ink);font-size:9px;font-weight:700}.summary-schedule input{display:block;width:100%;height:32px;margin-top:4px;border:1px solid #cfdacb;border-radius:6px;padding:0 6px;background:var(--white);color:var(--ink);font:10px 'DM Sans'}.summary-action{margin-top:12px}.summary-action .button{width:100%}.empty{margin:0;color:var(--muted);font-size:10px;line-height:1.5}.chosen{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #d7e2d1}.chosen strong,.chosen small{display:block}.chosen strong{font-size:11px}.chosen small{margin-top:3px;color:var(--muted);font-size:9px}.total{display:flex;justify-content:space-between;margin-top:13px;padding-top:13px;border-top:1px solid #cfdacb;font-size:12px;font-weight:700}.note{margin:10px 0 0;color:var(--muted);font-size:9px;line-height:1.45;text-align:center}.panel{padding:17px;border:1px solid var(--line);border-radius:11px;background:#fff}.panel h2{margin:0 0 6px;font-size:14px}.panel p{margin:0 0 16px;color:var(--muted);font-size:11px;line-height:1.45}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:block;margin-bottom:13px;color:var(--ink);font-size:11px;font-weight:600}.field input{display:block;width:100%;height:39px;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:#fff;color:var(--ink);font:12px 'DM Sans'}.field small{font-weight:400;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.button{border:0;border-radius:7px;padding:10px 13px;background:var(--ink);color:#fff;font:600 11px 'DM Sans';cursor:pointer}.button:disabled{background:#aab5a7;cursor:default}.button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.message{margin:0 0 12px;padding:9px 10px;border-radius:7px;background:#faeae5;color:#8e493f;font-size:10px}.success{text-align:center;padding:27px 13px}.success-mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 14px;border-radius:50%;background:#e2eee5;color:var(--good);font-size:24px}.success h2{font:700 21px 'Libre Baskerville',serif}@media(max-width:700px){.top{align-items:flex-start;gap:10px;padding:17px}.main{grid-template-columns:1fr;padding:24px 17px}.summary{order:-1}h1{font-size:24px}.form-row,.summary-schedule{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main class="booking-window">
      <header class="top"><div class="brand"><span class="brand-mark">S</span><span id="salon-name">Salon Genie</span></div><select class="branch" id="branch-select" aria-label="Choose branch"></select></header>
      <section class="main"><div><p class="eyebrow">BOOK YOUR VISIT</p><h1 id="booking-title">What would you like to book?</h1><p class="intro" id="booking-intro">Choose one or more services or combos. You’ll select a time next.</p><div class="steps" id="steps"></div><div id="booking-stage"></div></div><aside class="summary"><h2>Your appointment</h2><div id="summary"><p class="empty">Choose one or more services to see them here.</p></div><div class="summary-schedule"><label>Date<input id="summary-booking-date" type="date" min="2026-08-10" max="2026-08-16"></label><label>Time<input id="summary-booking-time" type="time" min="06:00" max="23:30" step="900"></label></div><div class="summary-action" id="summary-action"></div><p class="note">Final prices for colour services may be confirmed after a consultation.</p></aside></section>
    </main>
    <script>
      const fallback={organisation:{name:'Maison Violet'},activeBranch:'ind',branches:[{id:'ind',name:'Indiranagar, Bengaluru'}],staff:[{id:1,branch:'ind'}],clients:[],services:[{id:1,name:'Haircut & style',category:'Hair',duration:60,price:1800,onlineBookable:true},{id:2,name:'Balayage',category:'Hair',duration:180,price:6800,onlineBookable:true},{id:3,name:'Signature facial',category:'Skin',duration:90,price:3200,onlineBookable:true},{id:4,name:'Gel manicure',category:'Nails',duration:60,price:1600,onlineBookable:true}],combos:[],appointments:[]};
      let catalogue;try{catalogue=JSON.parse(localStorage.getItem('salon-genie-data'))||fallback}catch{catalogue=fallback}catalogue.clients??=[];catalogue.appointments??=[];catalogue.combos??=[];const money=value=>'₹'+Number(value).toLocaleString('en-IN');const idFor=key=>Math.max(0,...catalogue[key].map(item=>Number(item.id)||0))+1;const branchSelect=document.getElementById('branch-select');const stageRoot=document.getElementById('booking-stage');const summary=document.getElementById('summary');const steps=document.getElementById('steps');const title=document.getElementById('booking-title');const intro=document.getElementById('booking-intro');const summaryDate=document.getElementById('summary-booking-date');const summaryTime=document.getElementById('summary-booking-time');let branchId=catalogue.activeBranch||catalogue.branches[0].id;let stage=1;let category='All';let selected=new Set();let bookingDate='2026-08-10';let bookingTime='10:00';
      document.getElementById('salon-name').textContent=catalogue.organisation?.name||'Salon Genie';branchSelect.innerHTML=catalogue.branches.map(branch=>`<option value="${branch.id}" ${branch.id===branchId?'selected':''}>${branch.name}</option>`).join('');branchSelect.onchange=event=>{branchId=event.target.value;selected.clear();render()};summaryDate.value=bookingDate;summaryTime.value=bookingTime;summaryDate.onchange=event=>{bookingDate=event.target.value};summaryTime.onchange=event=>{bookingTime=event.target.value};
      const onlineEntries=()=>{const services=catalogue.services.filter(item=>item.onlineBookable!==false&&(!item.availableBranches||item.availableBranches.includes(branchId))).map(item=>({...item,type:'service'}));const combos=catalogue.combos.filter(item=>item.onlineBookable!==false&&(!item.availableBranches||item.availableBranches.includes(branchId))).map(item=>({...item,category:'Combos',type:'combo'}));return [...services,...combos]};
      const selectedEntries=()=>onlineEntries().filter(item=>selected.has(`${item.type}-${item.id}`));const total=()=>selectedEntries().reduce((sum,item)=>sum+Number(item.price),0);const duration=()=>selectedEntries().reduce((sum,item)=>sum+Number(item.duration),0);
      function renderSummary(){const entries=selectedEntries();summary.innerHTML=entries.length?`${entries.map(item=>`<div class="chosen"><span><strong>${item.name}</strong><small>${item.duration} min</small></span><b>${money(item.price)}</b></div>`).join('')}<div class="total"><span>${entries.length} selected · ${duration()} min</span><span>${money(total())}</span></div>`:'<p class="empty">Choose one or more services to see them here.</p>'}
      function renderSteps(){steps.innerHTML=['Services & time','Your details'].map((label,index)=>`<span class="step ${stage===index+1?'active':''}"><i>${index+1}</i>${label}</span>`).join('')}
      function serviceStage(){const entries=onlineEntries();const categories=['All',...new Set(entries.map(item=>item.category))];stageRoot.innerHTML=`<div class="categories">${categories.map(item=>`<button type="button" class="${category===item?'active':''}" data-category="${item}">${item}</button>`).join('')}</div><div class="service-list">${entries.filter(item=>category==='All'||item.category===category).map(item=>`<button type="button" class="service ${selected.has(`${item.type}-${item.id}`)?'active':''}" data-entry="${item.type}-${item.id}"><span class="check">✓</span><span class="icon">${item.type==='combo'?'✦':item.category==='Hair'?'✂':item.category==='Skin'?'◐':'◈'}</span><span class="copy"><strong>${item.name}</strong><small>${item.type==='combo'?'Package · ':''}${item.duration} min</small></span><span class="price">${money(item.price)}</span></button>`).join('')||'<p class="empty">No services are currently available online for this branch.</p>'}</div>`;const summaryAction=document.getElementById('summary-action');summaryAction.innerHTML=`<button class="button" id="next-stage" ${selected.size?'':'disabled'}>Continue to your details</button>`;stageRoot.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{category=button.dataset.category;render()});stageRoot.querySelectorAll('[data-entry]').forEach(button=>button.onclick=()=>{const key=button.dataset.entry;selected.has(key)?selected.delete(key):selected.add(key);render()});document.getElementById('next-stage')?.addEventListener('click',()=>{bookingDate=summaryDate.value;bookingTime=summaryTime.value;if(!bookingDate||!bookingTime)return;stage=2;render()})}
      function timeStage(){stageRoot.innerHTML=`<section class="panel"><h2>Choose date & time</h2><p>Your services take about ${duration()} minutes. You can also change these details in Your appointment.</p><div class="form-row"><label class="field">Date<input id="booking-date" type="date" value="${bookingDate}" min="2026-08-10" max="2026-08-16" required></label><label class="field">Preferred start time<input id="booking-time" type="time" value="${bookingTime}" min="06:00" max="23:30" step="900" required></label></div><div class="actions"><button class="button secondary" id="back-stage">Back</button><button class="button" id="next-stage">Continue to your details</button></div></section>`;document.getElementById('back-stage').onclick=()=>{stage=1;render()};document.getElementById('next-stage').onclick=()=>{bookingDate=document.getElementById('booking-date').value;bookingTime=document.getElementById('booking-time').value;summaryDate.value=bookingDate;summaryTime.value=bookingTime;if(!bookingDate||!bookingTime)return;stage=3;render()}}
      function detailStage(){stageRoot.innerHTML=`<form class="panel" id="guest-form"><h2>Your details</h2><p>We’ll use these details to create your guest profile and confirm your booking.</p><div class="form-row"><label class="field">Full name<input name="name" required autocomplete="name" placeholder="Your full name"></label><label class="field">Phone number<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="Your phone number"></label></div><label class="field">User ID<input name="userId" required autocomplete="username" placeholder="e.g. your Instagram ID"></label><div class="actions"><button class="button secondary" type="button" id="back-stage">Back</button><button class="button" type="submit">Confirm booking</button></div></form>`;document.getElementById('back-stage').onclick=()=>{stage=1;render()};document.getElementById('guest-form').onsubmit=event=>{event.preventDefault();saveBooking(new FormData(event.target))}}
      function toMinutes(time){const[hours,minutes]=time.split(':').map(Number);return hours*60+minutes}function formatTime(minutes){return `${String(Math.floor(minutes/60)%24).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`}
      function saveBooking(form){const name=form.get('name').trim();const phone=form.get('phone').trim();const userId=form.get('userId').trim();let client=catalogue.clients.find(item=>item.phone.replace(/\D/g,'')===phone.replace(/\D/g,''));if(client){client.name=name;client.userId=userId||client.userId}else{client={id:idFor('clients'),name,phone,userId,instaId:userId.replace(/^@/,''),visits:0,spent:0,note:'',branch:branchId};catalogue.clients.push(client)}const branchStaff=catalogue.staff.find(item=>item.branch===branchId)||catalogue.staff[0];if(!branchStaff){stageRoot.innerHTML='<p class="message">This branch needs a team member before it can accept online bookings.</p>';return}let start=toMinutes(bookingTime);const servicesToBook=[];selectedEntries().forEach(entry=>{if(entry.type==='combo'){(entry.serviceIds||[]).forEach(id=>{const item=catalogue.services.find(service=>service.id===Number(id));if(item)servicesToBook.push(item)})}else servicesToBook.push(entry)});servicesToBook.forEach(item=>{catalogue.appointments.push({id:idFor('appointments'),clientId:client.id,serviceId:item.id,staffId:branchStaff.id,time:formatTime(start),duration:item.duration,date:bookingDate,branch:branchId,status:'confirmed',paid:false});start+=Number(item.duration)});localStorage.setItem('salon-genie-data',JSON.stringify(catalogue));title.textContent='Thank you for your booking';intro.textContent='The salon team has received your appointment request.';stageRoot.innerHTML=`<section class="panel success"><span class="success-mark">✓</span><h2>Thank you, ${name}</h2><p>Your booking for ${bookingDate} at ${bookingTime} has been received. The salon will contact you if any details need confirmation.</p></section>`;steps.innerHTML='';renderSummary()}
      function render(){renderSteps();renderSummary();document.getElementById('summary-action').innerHTML='';title.textContent=stage===1?'What would you like to book?':'Almost there';intro.textContent=stage===1?'Choose a date and time in Your appointment, then select one or more services or combos.':'Enter your details to confirm this booking.';if(stage===1)serviceStage();else detailStage()}render();
    </script>
  </body>
</html>
